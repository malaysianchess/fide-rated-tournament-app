<style>
  :root {
    --surface: #ffffff;
    --bg-body: #F8FAFC;
    --sidebar: #0F172A;
    --sidebar-hover: #1E293B;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --text-light: #F8FAFC;
    
    --primary: #DC2626; /* Crimson Red */
    --primary-hover: #B91C1C;
    --primary-light: #FEE2E2;
    
    --accent: #EAB308; /* Bold Yellow */
    --accent-hover: #CA8A04;
    --accent-light: #FEF9C3;
    
    --danger: #DC2626;
    --warning: #F59E0B;
    
    --border: #E2E8F0;
    --border-soft: #F1F5F9;
    
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    
    --font: 'Inter', sans-serif;
  }
  
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; font-family: var(--font); background: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--primary-light); color: var(--primary-hover); }

  .view { display: none; min-height: 100vh; animation: fadeIn 0.3s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .auth-view.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: var(--sidebar); }
  .dash-view.active { display: grid; grid-template-columns: 280px 1fr; }
  .wizard-view.active { display: grid; grid-template-columns: 320px 1fr; }

  /* Mobile Responsive Breakpoint & Sidebar Toggle */
  .mobile-nav-bar { display: none; }

  @media (max-width: 900px) {
    .dash-view.active, .wizard-view.active { display: flex; flex-direction: column; }
    .mobile-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--sidebar);
      color: white;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .mobile-nav-bar h2 { font-size: 15px; margin: 0; font-weight: 600; }
    .mobile-menu-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .rail {
      position: relative !important;
      height: auto !important;
      width: 100% !important;
      box-shadow: none !important;
      display: none !important;
    }
    .rail.mobile-open {
      display: flex !important;
    }
    .stage { padding: 20px !important; }
    .stage-header { flex-direction: column; align-items: flex-start !important; gap: 12px; }
    .stage-header > div:last-child { width: 100%; display: flex; flex-wrap: wrap; gap: 8px !important; }
    .field-grid { grid-template-columns: 1fr !important; }
  }

  .rail {
    background: var(--sidebar);
    color: var(--text-light);
    padding: 32px 24px 24px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .crest { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .crest-mark { width: 44px; height: auto; flex: none; background: transparent; border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
  .crest-text .eyebrow { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 2px; font-weight: 600; }
  .crest-text h1 { font-size: 16px; font-weight: 600; margin: 0; color: white; letter-spacing: -0.02em; }

  .gateway { width: 100%; max-width: 420px; }
  .brand-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 32px; }
  .brand-head h1 { font-size: 24px; font-weight: 600; color: white; margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 32px; position: relative; }
  
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  .field label .link-opt { text-transform: none; font-size: 12px; color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 500; }
  .field label .link-opt:hover { text-decoration: underline; }
  
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=email], input[type=tel], select, textarea, input[type=file] {
    font-family: var(--font); font-size: 14px; color: var(--text-main); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; width: 100%;
    transition: all 0.2s ease;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); }
  input:disabled { background: var(--bg-body); color: var(--text-muted); cursor: not-allowed; }
  
  .form-error { background: #FEE2E2; color: #991B1B; font-size: 13px; font-weight: 500; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; text-align: center; display: none; }

  .btn { font-family: var(--font); font-weight: 500; font-size: 14px; padding: 10px 20px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .btn-submit, .btn-primary { background: var(--primary); color: white; width: 100%; }
  .btn-submit:hover, .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25); }
  
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); width: auto; }
  .btn-ghost:hover { background: var(--bg-body); color: var(--text-main); }
  
  .btn-gold { background: var(--surface); color: var(--text-main); border-color: var(--border); box-shadow: var(--shadow-sm); }
  .btn-gold:hover { border-color: var(--accent); color: var(--accent-hover); }

  .gateway-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .gateway-foot a { color: var(--primary); text-decoration: none; font-weight: 500; cursor: pointer; }
  .gateway-foot a:hover { text-decoration: underline; }

  .rail-lede { font-size: 13px; line-height: 1.6; color: var(--text-muted); margin: 0 0 24px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .board-progress { margin-bottom: 32px; }
  .board-progress .label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; letter-spacing: 0.05em; }
  
  .rank { display: flex; gap: 8px; }
  .sq { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); border: none; cursor: pointer; transition: all 0.3s ease; padding: 0; font-size: 0; }
  .sq.done { background: var(--primary); }
  .sq.current { background: var(--accent); box-shadow: 0 0 8px rgba(234, 179, 8, 0.5); }
  
  .dossier { margin-top: auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: white; padding: 20px; border-radius: var(--radius-lg); }
  .dossier .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin: 0 0 8px; }
  .dossier h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
  .dossier dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .dossier .row { display: flex; justify-content: space-between; font-size: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .dossier .row:last-child { border: none; padding-bottom: 0; }
  .dossier dt { color: var(--text-muted); }
  .dossier dd { margin: 0; font-weight: 500; text-align: right; }
  
  .stage { padding: 48px; overflow-y: auto; }
  .stage-inner { max-width: 680px; margin: 0 auto; background: var(--surface); padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .step-head { margin-bottom: 32px; }
  .step-eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--primary); margin: 0 0 8px; letter-spacing: 0.05em; }
  .step-head h2 { font-size: 24px; font-weight: 700; margin: 0 0 8px; color: var(--text-main); letter-spacing: -0.02em; }
  .step-head p { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin: 0; }
  
  .step { display: none; animation: slideUp 0.3s ease; }
  .step.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .field.full { grid-column: 1 / -1; }
  
  .combo { position: relative; }
  .combo-input { cursor: pointer; }
  .combo-panel { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 280px; overflow-y: auto; display: none; }
  .combo-panel.open { display: block; animation: fadeIn 0.15s ease; }
  .combo-search { padding: 8px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .combo-group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); background: var(--bg-body); padding: 8px 14px; position: sticky; top: 51px; }
  .combo-opt { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border-soft); transition: background 0.15s; }
  .combo-opt:hover { background: var(--primary-light); color: var(--primary-hover); }
  
  .fee-box { background: var(--bg-body); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .fee-box-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin: 0 0 16px; letter-spacing: 0.05em; }
  .fee-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; color: var(--text-main); }
  .fee-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); font-size: 20px; font-weight: 700; color: var(--primary); }
  
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }

  .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px; letter-spacing: 0.05em; }
  .nav-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 32px; }
  .nav-item { display: flex; justify-content: space-between; align-items: center; background: transparent; border: none; color: var(--text-muted); padding: 10px 12px; border-radius: var(--radius); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.2s; }
  .nav-item:hover { background: var(--sidebar-hover); color: white; }
  .nav-item.active { background: rgba(220, 38, 38, 0.15); color: var(--accent); font-weight: 600; }
  .badge { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .nav-item.active .badge { background: var(--primary); color: white; }
  
  .admin-stats { margin-top: auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 16px; border-radius: var(--radius); margin-bottom: 24px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .stat-row:last-child { margin: 0; }
  .stat-row strong { color: white; font-weight: 600; }
  
  .btn-logout { background: transparent; border: none; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; padding: 0; transition: color 0.2s; }
  .btn-logout:hover { color: var(--danger); }

  .stage-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
  .stage-header h2 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .stage-header p { font-size: 14px; color: var(--text-muted); margin: 6px 0 0; }
  
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-body); padding: 14px 20px; border-bottom: 1px solid var(--border); }
  td { padding: 16px 20px; font-size: 13px; color: var(--text-main); border-bottom: 1px solid var(--border-soft); vertical-align: middle; transition: background 0.2s; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-body); cursor: pointer; }
  
  .status-pill { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  
  .drawer-back { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; justify-content: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .drawer-back.open { opacity: 1; pointer-events: auto; }
  .drawer { background: var(--surface); width: 640px; max-width: 90vw; height: 100vh; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .drawer-back.open .drawer { transform: translateX(0); }
  
  .drawer-head { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .drawer-head h3 { font-size: 20px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .drawer-head p { margin: 0; font-size: 13px; color: var(--text-muted); }
  .drawer-close { background: var(--bg-body); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
  .drawer-close:hover { background: var(--border); color: var(--text-main); }
  
  .drawer-body { padding: 32px; flex: 1; }
  .section-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin: 32px 0 16px; display: flex; align-items: center; gap: 12px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .section-title:first-child { margin-top: 0; }
  
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .data-item .label { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
  .data-item span:not(.label) { font-size: 14px; color: var(--text-main); font-weight: 500; }
  
  .drawer-footer { padding: 20px 32px; border-top: 1px solid var(--border); background: var(--bg-body); display: flex; justify-content: space-between; position: sticky; bottom: 0; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--sidebar); color: white; padding: 12px 24px; border-radius: 99px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 10px; z-index: 300; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
</style>
