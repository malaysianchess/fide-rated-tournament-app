// Clean Helper for Malaysia Local Time (GMT+8) formatting
function formatLocalDate(dateStr) {
    if (!dateStr) return '—';
    try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('en-GB', { timeZone: 'Asia/Kuala_Lumpur', day: '2-digit', month: 'short', year: 'numeric' });
    } catch(e) {
        return dateStr;
    }
}

auth.onAuthStateChanged(user => {
    if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
            if(doc.exists) {
                currentUserProfile = { uid: user.uid, email: user.email, ...doc.data() };
                
                if (user.email.toLowerCase() === CORE_ADMIN_EMAIL.toLowerCase() && currentUserProfile.role !== 'core_admin') {
                    db.collection('users').doc(user.uid).update({ role: 'core_admin' });
                    currentUserProfile.role = 'core_admin';
                }
                
                if(currentUserProfile.role === 'admin' || currentUserProfile.role === 'core_admin' || currentUserProfile.role === 'state_admin') {
                    document.getElementById('btnGoAdminView').style.display = 'inline-flex'; 
                    document.getElementById('adminRoleEyebrow').innerText = currentUserProfile.role === 'state_admin' ? (currentUserProfile.state + ' Association') : 'MCF Administration';
                    
                    if (currentUserProfile.role === 'state_admin') {
                        const stateSel = document.getElementById('stateFilter');
                        if (stateSel) {
                            stateSel.value = currentUserProfile.state;
                            stateSel.disabled = true;
                            selectedStateFilter = currentUserProfile.state;
                        }
                    }

                    if (currentUserProfile.role === 'core_admin') {
                        document.getElementById('systemAdminMenu').style.display = 'block';
                        listenForUsers();
                    }
                    showView('admin');
                } else {
                    document.getElementById('btnGoAdminView').style.display = 'none'; 
                    showView('organizer-dash');
                }
                fetchDossiers(); 
            } else { auth.signOut(); }
        });
    } else {
        showView('login');
        currentUserProfile = {}; 
    }
});

function getBadgeStyle(status) {
    if (status === 'PENDING STATE') return 'background: #FEF3C7; color: #92400E;';
    if (status === 'PENDING ADMIN') return 'background: #DBEAFE; color: #1E40AF;';
    if (status === 'APPROVED') return 'background: #D1FAE5; color: #065F46;';
    return 'background: #FEE2E2; color: #991B1B;';
}

function fetchDossiers() {
    if (typeof google === 'undefined' || !google.script) {
        console.warn("Local env: Skipping Apps Script fetch."); return;
    }
    google.script.run.withSuccessHandler(function(data) {
        applications = (data || []).reverse(); 
        updateAdminCounts(); renderAdminTable();
        updateOrgCounts(); renderOrgTable();
    }).withFailureHandler(function(err){
        showToast("Error loading data from Sheets.");
    }).getDossiers();
}

    let viewableApps = applications;

    document.getElementById('cntPendingAdmin').innerText = viewableApps.filter(a => a.status === 'PENDING ADMIN').length;
    document.getElementById('cntApproved').innerText = viewableApps.filter(a => a.status === 'APPROVED').length;
    document.getElementById('cntRevision').innerText = viewableApps.filter(a => a.status === 'REVISION REQ.').length;
    document.getElementById('statFees').innerText = 'RM ' + viewableApps.filter(a => a.status === 'APPROVED').reduce((sum, app) => sum + (Number(app.fee) || 0), 0);

function renderAdminTable() {
    const tbody = document.getElementById('tableBody');
    if (!tbody) return; tbody.innerHTML = '';
    
    let filtered = applications; 
    
    if (currentUserProfile.role === 'state_admin') {
        filtered = filtered.filter(a => a.state === currentUserProfile.state);
    } else if (selectedStateFilter !== 'all') {
        filtered = filtered.filter(a => a.state === selectedStateFilter);
    }

    if (currentFilterAdmin !== 'all') {
        let target = currentFilterAdmin === 'pending_state' ? 'PENDING STATE' : currentFilterAdmin === 'pending_admin' ? 'PENDING ADMIN' : currentFilterAdmin === 'approved' ? 'APPROVED' : 'REVISION REQ.';
        filtered = filtered.filter(a => a.status === target);
    }

    if (searchQ.trim() !== '') {
        const q = searchQ.toLowerCase();
        filtered = filtered.filter(a => 
            (a.eventName || '').toLowerCase().includes(q) || 
            (a.organizerEmail || '').toLowerCase().includes(q) ||
            (a.id || '').toLowerCase().includes(q)
        );
    }
    
    filtered.forEach(app => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <b style="font-size:14px; color:var(--text-main);">${app.eventName}</b><br>
                <span style="font-size:11px; color:var(--text-muted);">${app.id} &bull; ${app.organizerEmail}</span>
            </td>
            <td>${app.state}<br><span style="font-size:11px; color:var(--text-muted);">${formatLocalDate(app.startDate)}</span></td>
            <td>${app.system} (${app.rounds || '-'} Rds)<br><span style="font-size:11px; color:var(--text-muted);">${app.timeControl || '-'}</span></td>
            <td>${app.pax} pax</td>
            <td>
                <b style="color:var(--text-main);">RM ${app.fee || 0}</b><br>
                <span style="font-size:11px; color:var(--text-muted);">Ref: ${app.paymentRef || '-'}</span>
            </td>
            <td>
                <div style="display:flex; align-items:center; gap:8px; justify-content:space-between;">
                    <span class="status-pill" style="${getBadgeStyle(app.status)}">${app.status}</span>
                    <button type="button" class="btn btn-ghost" style="padding:4px 10px; font-size:11px;">Review</button>
                </div>
            </td>
        `;
        tr.addEventListener('click', () => openDrawer(app.id));
        tbody.appendChild(tr);
    });
}

    myApps.forEach(app => {
        const tr = document.createElement('tr');
        
        let reportBadgeHtml = '';
        if (app.status === 'APPROVED') {
            const tunStatus = app.tunStatus || 'PENDING';

                reportBadgeHtml = `<br><span class="status-pill" style="background:#D1FAE5; color:#065F46; font-size:10px; margin-top:4px;">✓ .tun Received by MCF</span>`;
            } else if (tunStatus === 'REJECTED') {
                reportBadgeHtml = `<br><span class="status-pill" style="background:#FEE2E2; color:#991B1B; font-size:10px; margin-top:4px;">✗ .tun Rejected - Re-upload Req.</span>`;
            } else {
                const hasTun = app.tunUrl && app.tunUrl.startsWith('http');
                reportBadgeHtml = hasTun 
                    ? `<br><span class="status-pill" style="background:#DBEAFE; color:#1E40AF; font-size:10px; margin-top:4px;">⏳ .tun Pending Review</span>` 
                    : `<br><span class="status-pill" style="background:#FEF3C7; color:#92400E; font-size:10px; margin-top:4px;">⚠ .tun Report Missing</span>`;
            }
        }

        tr.innerHTML = `
            <td>
                <b style="font-size:14px; color:var(--text-main);">${app.eventName}</b><br>
                <span style="font-size:11px; color:var(--text-muted);">${app.id}</span>
            </td>
            <td>${app.state}<br><span style="font-size:11px; color:var(--text-muted);">${formatLocalDate(app.startDate)}</span></td>
            <td>${app.system} (${app.rounds || '-'} Rds)<br><span style="font-size:11px; color:var(--text-muted);">${app.timeControl || '-'}</span></td>
            <td>${app.pax} pax</td>
            <td>
                <b style="color:var(--text-main);">RM ${app.fee || 0}</b><br>
                <span style="font-size:11px; color:var(--text-muted);">Ref: ${app.paymentRef || '-'}</span>
            </td>
            <td>
                <div style="display:flex; align-items:center; gap:8px; justify-content:space-between;">
                    <span class="status-pill" style="${getBadgeStyle(app.status)}">${app.status}</span>
                    <button type="button" class="btn btn-ghost" style="padding:4px 10px; font-size:11px;">View</button>
                </div>
                ${reportBadgeHtml}
            </td>
        `;
        tr.addEventListener('click', () => openDrawer(app.id));
        tbody.appendChild(tr);
    });
}
document.querySelectorAll('#navFilterOrg .nav-item').forEach(btn => {

        btn.classList.add('active'); currentFilterOrg = btn.getAttribute('data-filter'); renderOrgTable();

document.querySelectorAll('#navFilter .nav-item').forEach(btn => {

        document.getElementById('adminAppsWrap').style.display = 'block'; document.getElementById('adminUsersWrap').style.display = 'none';

});

function listenForUsers() {
    db.collection("users").onSnapshot((snapshot) => {
        usersList = []; snapshot.forEach(doc => usersList.push({ id: doc.id, ...doc.data() }));
        usersList.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        renderUsersTable();
    });
}

function renderUsersTable() {
    const tbody = document.getElementById('tableBodyUsers'); 
    if (!tbody) return; 
    tbody.innerHTML = '';
    
    let filteredUsers = usersList;

    if (selectedUserRoleFilter !== 'all') {
        filteredUsers = filteredUsers.filter(u => (u.role || 'organizer') === selectedUserRoleFilter);
    }

    if (selectedUserStateFilter !== 'all') {
        filteredUsers = filteredUsers.filter(u => (u.state || '') === selectedUserStateFilter);
    }

    if (searchUsersQ.trim() !== '') {
        const q = searchUsersQ.toLowerCase();
        filteredUsers = filteredUsers.filter(u => 
            (u.name || '').toLowerCase().includes(q) || 
            (u.email || '').toLowerCase().includes(q)
        );
    }

    filteredUsers.forEach(u => {
        const tr = document.createElement('tr');
        let roleBadge = 'ORGANIZER', badgeStyle = 'background:#F1F5F9; color:#64748B;';
        if (u.role === 'state_admin') { roleBadge = 'STATE ADMIN'; badgeStyle = 'background:#FEF3C7; color:#92400E;'; }
        if (u.role === 'admin') { roleBadge = 'MCF ADMIN'; badgeStyle = 'background:#DBEAFE; color:#1E40AF;'; }
        if (u.role === 'core_admin') { roleBadge = 'CORE ADMIN'; badgeStyle = 'background:#FEE2E2; color:#991B1B;'; }

        let actionHtml = '-';
        
        if (currentUserProfile.role === 'core_admin') {
            if (u.email !== currentUserProfile.email) {
                actionHtml = `
                <div style="display:flex; gap:6px; align-items:center;">
                    <select class="role-select" id="role_${u.id}" style="padding:4px; font-size:12px; border:1px solid var(--border); border-radius:4px;">
                        <option value="organizer" ${u.role === 'organizer' ? 'selected' : ''}>Organizer</option>
                        <option value="state_admin" ${u.role === 'state_admin' ? 'selected' : ''}>State Admin</option>
                        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>MCF Admin</option>
                        <option value="core_admin" ${u.role === 'core_admin' ? 'selected' : ''}>Core Admin</option>
                    </select>
                    <button class="btn btn-gold btnChangeRole" data-id="${u.id}" style="padding: 3px 8px; font-size: 10px;">Save</button>
                </div>`;
            } else {
                actionHtml = `<span style="font-size:12px; color:var(--text-muted); font-style:italic;">(Your Account)</span>`;
            }
        } else {
            actionHtml = `<span style="font-size:12px; color:var(--text-muted);">Restricted</span>`;
        }

        tr.innerHTML = `<td><b style="font-size:14px;">${u.name || 'N/A'}</b></td><td>${u.email}</td><td>${u.state || '-'}</td><td><span class="status-pill" style="${badgeStyle}">${roleBadge}</span></td><td>${actionHtml}</td>`;
        tbody.appendChild(tr);
    });

    document.querySelectorAll('.btnChangeRole').forEach(b => b.addEventListener('click', (e) => {
        if (currentUserProfile.role !== 'core_admin') {
            showToast("Unauthorized action.");
            return;
        }
        db.collection('users').doc(e.target.dataset.id).update({ role: document.getElementById(`role_${e.target.dataset.id}`).value }); 
        showToast("Role updated successfully.");
    }));
}

document.getElementById('searchUsers').addEventListener('input', (e) => {
    searchUsersQ = e.target.value;
    renderUsersTable();
});

document.getElementById('userRoleFilter').addEventListener('change', (e) => {
    selectedUserRoleFilter = e.target.value;

document.getElementById('userStateFilter').addEventListener('change', (e) => {

});

function openDrawer(id){
    selectedId = id; const t = applications.find(x => x.id === id); if(!t) return;
    document.getElementById('dTitle').textContent = t.eventName;
    document.getElementById('dSubtitle').textContent = "Application ID: " + t.id;
    
    let tunSectionHtml = '';
    const isApproved = t.status === 'APPROVED';
    const isOrganizer = currentUserProfile.email === t.organizerEmail;
    const isMCFAdmin = ['admin', 'core_admin'].includes(currentUserProfile.role);

    if (isApproved) {
        const tunStatus = t.tunStatus || 'PENDING';
        let statusBadge = '';
        if (tunStatus === 'RECEIVED') {
            statusBadge = `<span style="font-size:12px; color:#065F46; font-weight:600; background:#D1FAE5; padding:4px 10px; border-radius:99px;">✓ .tun Received & Accepted</span>`;
        } else if (tunStatus === 'REJECTED') {
            statusBadge = `<span style="font-size:12px; color:#991B1B; font-weight:600; background:#FEE2E2; padding:4px 10px; border-radius:99px;">✗ .tun Rejected: ${t.tunRejectReason || 'No reason provided'}</span>`;
        } else {
            statusBadge = `<span style="font-size:12px; color:#1E40AF; font-weight:600; background:#DBEAFE; padding:4px 10px; border-radius:99px;">⏳ Pending MCF Review</span>`;
        }

        let tunActionHtml = '';
        if (t.tunUrl && t.tunUrl.startsWith('http')) {
            tunActionHtml = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <a href="${t.tunUrl}" target="_blank" class="btn btn-ghost" style="padding:6px 12px; font-size:12px; text-decoration:none; background:white;">Download Submitted .tun Report</a>
                ${isMCFAdmin && tunStatus !== 'RECEIVED' ? `
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-primary" style="padding:6px 12px; font-size:12px; background:#059669;" onclick="setTunStatus('${t.id}', 'RECEIVED')">Receive .tun</button>
                        <button class="btn btn-ghost" style="padding:6px 12px; font-size:12px; color:#DC2626; border-color:#DC2626;" onclick="promptRejectTun('${t.id}')">Reject .tun</button>
                    </div>
                ` : ''}
            </div>`;
        } else {
            tunActionHtml = `<span style="font-size:12px; color:var(--text-muted); font-style:italic; display:block; margin-top:8px;">No report uploaded yet by organizer.</span>`;

window.uploadTunFile = async function(id) {
    const fileInput = document.getElementById('tunUploadInput');
    if (!fileInput || fileInput.files.length === 0) {
        showToast("Please select a file first.");
        return;
    }
    const file = fileInput.files[0];
    showToast("Uploading tournament report...");

    const fileData = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
    });

    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.status === 'success') {
                showToast("✓ Tournament report uploaded successfully!");
                const item = applications.find(x => x.id === id);
                if (item) {
                    item.tunUrl = res.tunUrl;
                    item.tunStatus = 'PENDING';
                    item.tunRejectReason = '';
                }
                openDrawer(id);
                fetchDossiers();
            } else {
                showToast("Error uploading file: " + (res ? res.message : "Unknown error"));
            }
        })
        .withFailureHandler(function(err) {
            showToast("Connection Error: " + err.message);
        })
        .submitTunFile(id, fileData, file.name);
};

window.setTunStatus = function(id, status) {
    showToast("Updating .tun status...");
    google.script.run

            if (res && res.status === 'success') {
                showToast("✓ Tournament report marked as Received!");
                const item = applications.find(x => x.id === id);
                if (item) item.tunStatus = status;
                openDrawer(id);
                fetchDossiers();
            } else {
                showToast("Error: " + (res ? res.message : "Unknown error"));
            }
        })
        .withFailureHandler(function(err) {
            showToast("Connection Error: " + err.message);
        })
        .updateTunStatus(id, status, "");
};

window.promptRejectTun = function(id) {
    const reason = prompt("Please provide a reason why this .tun report is being rejected:");
    if (reason === null) return;
    if (!reason.trim()) {
        alert("Rejection reason cannot be empty.");
        return;
    }

    showToast("Submitting rejection comment...");
    google.script.run
        .withSuccessHandler(function(res) {
            if (res && res.status === 'success') {
                showToast("✓ .tun report rejected with comments.");
                const item = applications.find(x => x.id === id);
                if (item) {
                    item.tunStatus = 'REJECTED';
                    item.tunRejectReason = reason;
                }
                openDrawer(id);
                fetchDossiers();
            } else {
                showToast("Error: " + (res ? res.message : "Unknown error"));
            }
        })
        .withFailureHandler(function(err) {
            showToast("Connection Error: " + err.message);
        })
        .updateTunStatus(id, 'REJECTED', reason);
};

window.changeStatus = function(newStatus){
    if (!selectedId) {
        showToast("Error: No application selected.");
        return;
    }
    if (typeof google === 'undefined' || !google.script) {
        alert('Backend script disconnected.');
        return;
    }

    const footerBtns = document.querySelectorAll('#drawerFooter button');
    footerBtns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
    showToast("Saving status to Google Sheets...");

    google.script.run
        .withSuccessHandler(function(res) {
            footerBtns.forEach(b => { b.disabled = false; b.style.opacity = '1'; });
            
            if (res && res.status === 'success') { 
                const item = applications.find(x => x.id === selectedId);
                if (item) item.status = newStatus;
                
                updateAdminCounts(); 
                renderAdminTable();
                updateOrgCounts(); 
                renderOrgTable();
                
                closeDrawer(); 
                showToast("✓ Status updated to " + newStatus); 
                fetchDossiers(); 
            } else {
                showToast("Error: " + (res ? res.message : "Unknown response from server"));
            }
        })
        .withFailureHandler(function(err) {
            footerBtns.forEach(b => { b.disabled = false; b.style.opacity = '1'; });
            console.error("Apps Script Error:", err);
            showToast("Script Error: " + (err.message || err));
        })
        .updateDossierStatus(selectedId, newStatus);
};

function computeFee(){
    const pax = Math.max(parseInt(document.getElementById('pax').value, 10) || 0, 32); 
    const orgCat = document.getElementById('orgCategory')?.value || "";
    
    let base = 300; 
    // ONLY verified state admins get the RM200 fee, even if others select the option.
    if (orgCat.includes("State Affiliate") && currentUserProfile.role === 'state_admin') {
        base = 200;
    }

    let perPlayer = 10; 

    const tcText = (document.getElementById('tcInput')?.value || "").toLowerCase();
    if (tcText.includes("rapid") || tcText.includes("blitz")) {
        perPlayer = 3; 
    }

    return { base, perPlayer, total: base + (perPlayer * pax) };
}

function updateDossier() {
    document.getElementById('dEventName').textContent = document.getElementById('eventName')?.value || "Untitled event";
    document.getElementById('dVenue').textContent = document.getElementById('venue')?.value || "—";
    document.getElementById('dSystem').textContent = document.getElementById('system')?.value || "—";
    document.getElementById('dTC').textContent = document.getElementById('tcInput')?.value || "—";
    document.getElementById('dArbiter').textContent = document.getElementById('chiefArbiter')?.value || "—";
    
    const fee = computeFee();
    const pax = parseInt(document.getElementById('pax')?.value) || 0;
    document.getElementById('dFee').textContent = fee.total ? ("RM " + fee.total) : "—";
    if (document.getElementById('feeBase')) document.getElementById('feeBase').textContent = "RM " + fee.base;
    if (document.getElementById('feePerPlayer')) document.getElementById('feePerPlayer').textContent = "RM " + (fee.perPlayer * Math.max(pax, 32));
    if (document.getElementById('feeTotal')) document.getElementById('feeTotal').textContent = "RM " + fee.total;
    
    const start = document.getElementById('dateStart')?.value; const end = document.getElementById('dateEnd')?.value;
    if (document.getElementById('dDates')) document.getElementById('dDates').innerText = (start && end) ? `${formatLocalDate(start)} to ${formatLocalDate(end)}` : (formatLocalDate(start) || '—');
}

function renderTC(filter){
    const tcList = document.getElementById('tcList'); tcList.innerHTML = "";
    Object.keys(TC).forEach(group => {
        const matches = TC[group].filter(o => o.toLowerCase().includes((filter||"").toLowerCase()));
        if(!matches.length) return;
        const lbl = document.createElement('div'); lbl.className="combo-group-label"; lbl.textContent=group; tcList.appendChild(lbl);
        matches.forEach(o => {
            const d = document.createElement('div'); d.className="combo-opt"; d.textContent=o;
            d.addEventListener('click', () => {
                document.getElementById('tcInput').value = o + " (" + group + ")";
                document.getElementById('tcPanel').classList.remove('open'); updateDossier();
            });
            tcList.appendChild(d);
        });
    });
}

}

    // DEADLINE VALIDATION (Clauses 3.5 & 3.6)
    // ----------------------------------------------------
    const startDateVal = document.getElementById('dateStart')?.value;
    if (startDateVal) {
        const startDate = new Date(startDateVal);
        const today = new Date();
        const diffTime = startDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        const isTitleNorm = document.getElementById('chkTitleNorms')?.checked;
        const tcText = (document.getElementById('tcInput')?.value || "").toLowerCase();
        const isRapidOrBlitz = tcText.includes("rapid") || tcText.includes("blitz");

        let minDays = 14; // Standard default (Clause 3.5)
        let ruleDesc = "Standard tournaments must be submitted at least 14 days before the start date (Clause 3.5).";

        if (isRapidOrBlitz) {
            minDays = 7;
            ruleDesc = "Rapid and Blitz tournaments must be submitted at least 7 days before the start date (Clause 3.6).";
        }
        if (isTitleNorm) {
            minDays = 30;
            ruleDesc = "Title-norm tournaments must be submitted at least 30 days before the start date (Clause 3.5.1).";
        }

        if (diffDays < minDays) {
            showToast(`Submission Error: ${ruleDesc} (Selected date is only ${diffDays} days away).`);
            return;
        }
    }

    this.textContent = "Uploading files to Drive..."; 
    this.disabled = true;

    const fileInput = document.getElementById('receiptUpload');
    let fileData = null; let fileName = null;

    if (fileInput.files.length > 0) {
        const file = fileInput.files[0]; fileName = file.name;
        fileData = await new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(file); });
    }

    const orgCat = document.getElementById('orgCategory')?.value || '';
    const letterInput = document.getElementById('affiliateLetterUpload');
    let letterData = null; let letterName = null;

    if (orgCat.includes('State Affiliate') && letterInput && letterInput.files.length > 0) {
        const letterFile = letterInput.files[0]; letterName = letterFile.name;
        letterData = await new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(letterFile); });
    }

    const posterInput = document.getElementById('posterUpload');
    let posterData = null; let posterName = null;
    if (posterInput && posterInput.files.length > 0) {
        const posterFile = posterInput.files[0]; posterName = posterFile.name;
        posterData = await new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(posterFile); });
    }

    const payload = {
        eventName: document.getElementById('eventName')?.value || 'Untitled',
        venue: document.getElementById('venue')?.value || 'Not specified',
        state: document.getElementById('orgState')?.value || 'W.P. Kuala Lumpur',
        orgCategory: orgCat || 'Independent Organizer',
        pax: parseInt(document.getElementById('pax')?.value) || 0,
        startDate: document.getElementById('dateStart')?.value || '',
        endDate: document.getElementById('dateEnd')?.value || '',
        fideLaws: document.getElementById('chkFideLaws')?.checked ? 'Yes' : 'No',
        natChampionship: document.getElementById('chkNatChampionship')?.checked ? 'Yes' : 'No',
        titleNorms: document.getElementById('chkTitleNorms')?.checked ? 'Yes' : 'No',
        normAvailable: document.getElementById('normAvailable')?.value || 'No',
        directTitle: document.getElementById('chkDirectTitle')?.checked ? 'Yes' : 'No',
        tourneyType: document.getElementById('tourneyType')?.value || 'Over the Board',
        system: document.getElementById('system')?.value || 'Not specified',
        rounds: document.getElementById('rounds')?.value || '7',
        multiRoundDays: document.getElementById('multiRoundDays')?.value || '1',
        maxRating: document.getElementById('maxRating')?.value || 'No limit',
        software: document.getElementById('software')?.value || 'ChessManager',
        tb1: document.getElementById('tb1')?.value || 'Direct encounter',
        tb2: document.getElementById('tb2')?.value || 'Buchholz',
        tb3: document.getElementById('tb3')?.value || '',
        timeControl: document.getElementById('tcInput')?.value || '',
        totalFee: computeFee().total,
        paymentRef: document.getElementById('paymentRef')?.value || 'Pending Validation',
        chiefArbiter: document.getElementById('chiefArbiter')?.value || '',
        chiefArbiterFide: document.getElementById('chiefArbiterFide')?.value || '',
        deputyArbiter: document.getElementById('deputyChiefArbiter')?.value || '',
        deputyArbiterFide: document.getElementById('deputyChiefArbiterFide')?.value || '',
        chiefOrg: document.getElementById('chiefOrg')?.value || '',
        chiefOrgFide: document.getElementById('chiefOrgFide')?.value || '',
        orgBody: document.getElementById('orgBody')?.value || '',
        orgBodyFide: document.getElementById('orgBodyFide')?.value || '',
        fairPlay: document.getElementById('fairPlayOfficer')?.value || '',
        fairPlayFide: document.getElementById('fairPlayOfficerFide')?.value || '',
        femaleOnly: document.getElementById('chkFemaleOnly')?.checked ? 'Yes' : 'No',
        ageLimit: document.getElementById('ageLimit')?.value || 'None',
        digitalClock: document.getElementById('chkDigitalClock')?.checked ? 'Yes' : 'No',
        pgnProvided: document.getElementById('chkPgnProvided')?.checked ? 'Yes' : 'No',
        internetLive: document.getElementById('chkInternetLive')?.checked ? 'Yes' : 'No',
        contactEmail: document.getElementById('contactEmail')?.value || '',
        homepage: document.getElementById('internetHomepage')?.value || '',
        prizeFund: document.getElementById('prizeFund')?.value || '',
        remarks: document.getElementById('remarks')?.value || '',
        obj1: document.getElementById('obj1')?.value || '',
        signName: document.getElementById('signName')?.value || '',
        signDate: document.getElementById('signDate')?.value || '',
        organizerEmail: currentUserProfile.email,
        fileData: fileData, 
        fileName: fileName,
        letterData: letterData,
        letterName: letterName,
        posterData: posterData,
        posterName: posterName
    };

    if(google.script) {
        google.script.run.withSuccessHandler(function(result) {
            if (result.status === 'success') {
                document.getElementById('wizard').reset();
                document.getElementById('submitAppBtn').textContent = "Submit Application"; 
                document.getElementById('submitAppBtn').disabled = false;
                showToast("Application securely submitted!"); 
                showView('organizer-dash'); 
                fetchDossiers(); 
            } else { 
                showToast("Server Error: " + result.message); 
                document.getElementById('submitAppBtn').textContent = "Submit Application"; 
                document.getElementById('submitAppBtn').disabled = false;
            }
        }).withFailureHandler(function(error) {
            showToast("Connection Error. Check console."); 
            document.getElementById('submitAppBtn').textContent = "Submit Application"; 
            document.getElementById('submitAppBtn').disabled = false;
        }).submitDossier(payload);
    }
});

window.generateDossierPDF = function(id) {
    const app = applications.find(x => x.id === id); if (!app) return;
    const { jsPDF } = window.jspdf; const doc = new jsPDF();

    doc.setFillColor(15, 23, 42); doc.rect(0, 0, 210, 45, 'F'); 
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.text("MALAYSIAN CHESS FEDERATION", 105, 22, { align: "center" });
    doc.setTextColor(220, 38, 38); doc.setFont("helvetica", "normal"); doc.setFontSize(14); doc.text("FIDE-Rated Event Application Summary", 105, 32, { align: "center" });

    let currentY = 55; const labelX = 20, valueX = 85;

    const drawSection = (title) => {
        if (currentY > 250) { doc.addPage(); currentY = 20; } 
        currentY += 4;
        doc.setTextColor(15, 23, 42); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text(title, 20, currentY);
        currentY += 3; doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.5); doc.line(20, currentY, 190, currentY); currentY += 7;
    };

    const printRow = (label, value) => {
        if (currentY > 270) { doc.addPage(); currentY = 20; }
        doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text(label + ":", labelX, currentY);
        doc.setFont("helvetica", "normal"); const splitValue = doc.splitTextToSize(String(value || '-'), 105); doc.text(splitValue, valueX, currentY); currentY += (splitValue.length * 5) + 2; 
    };

    drawSection("1. Compliance & General Details");
    printRow("Application ID", app.id);
    printRow("Approval Status", app.status);
    printRow("Event Name", app.eventName);
    printRow("Venue & State", `${app.venue || '-'}, ${app.state || '-'}`);
    printRow("Organizer Category", app.orgCategory);
    printRow("FIDE Laws Followed", app.fideLaws);
    printRow("National Championship (1.43a)", app.natChampionship);
    printRow("Title Norms Available", `${app.titleNorms} (${app.normAvailable || 'No'})`);
    printRow("Direct Title Events", app.directTitle);
    printRow("Tournament Type", app.tourneyType);
    printRow("Start Date", formatLocalDate(app.startDate));
    printRow("End Date", formatLocalDate(app.endDate));

    drawSection("2. Format & Technical Specifications");
    printRow("Expected Players", app.pax);
    printRow("Tournament System", app.system);
    printRow("Number of Rounds Reported", app.rounds);
    printRow("Multiple Round Days", app.multiRoundDays);
    printRow("Time Control Category", app.timeControl);
    printRow("Pairing Software", app.software);
    printRow("1st Tiebreak Method", app.tb1);
    printRow("2nd Tiebreak Method", app.tb2);
    printRow("3rd Tiebreak Method", app.tb3 || '-');

    drawSection("3. Officials & Arbiters");
    printRow("Chief Arbiter", `${app.chiefArbiter || '-'} (FIDE ID: ${app.chiefArbiterFide || '-'})`);
    printRow("Deputy Chief Arbiter", `${app.deputyArbiter || 'None'} (FIDE ID: ${app.deputyArbiterFide || '-'})`);
    printRow("Chief Organizer", `${app.chiefOrg || '-'} (FIDE ID: ${app.chiefOrgFide || '-'})`);
    printRow("Organizing Body", `${app.orgBody || '-'} (FIDE ID: ${app.orgBodyFide || '-'})`);
    printRow("Fair Play Officer", `${app.fairPlay || 'None'} (FIDE ID: ${app.fairPlayFide || '-'})`);

    drawSection("4. Additional Info, Payment & Declaration");
    printRow("Female Only?", app.femaleOnly);
    printRow("Max Rating Limit", app.maxRating);
    printRow("Age Limit", app.ageLimit);
    printRow("All Digital Clocks?", app.digitalClock);
    printRow("Will PGN be Provided?", app.pgnProvided);
    printRow("Internet Transmission?", app.internetLive);
    printRow("Contact Email", app.contactEmail || app.organizerEmail);
    printRow("Internet Homepage", app.homepage);
    printRow("Prize Fund", app.prizeFund);
    printRow("Remarks", app.remarks);
    printRow("Total Fee Due (Deposit)", 'RM ' + (app.fee || 0));
    printRow("Payment Reference", app.paymentRef);
    printRow("Objectives", app.obj1);
    printRow("Signed By", `${app.signName || '-'} on ${formatLocalDate(app.signDate)}`);

    doc.save(`MCF_FIDE_Dossier_${(app.eventName || 'Event').replace(/\s+/g, '_')}.pdf`);
};
